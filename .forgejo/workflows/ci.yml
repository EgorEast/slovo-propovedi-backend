name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    # Tag pushes should not trigger CI (handled by release.yml).
    # Tags point at commits already checked when they were pushed to main;
    # some Forgejo versions still dispatch this workflow for tag pushes
    # despite the branches filter, so guard explicitly.
    if: github.ref_type != 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Cleanup workspace
        if: always()
        run: rm -rf node_modules 2>/dev/null || true
