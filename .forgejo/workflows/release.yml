name: Release

on:
  push:
    tags:
      - v*

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "::error::Run: npm run bump-version -- <patch|minor|major> && git push origin main --follow-tags"
            exit 1
          fi

      - name: Wait for CI to pass on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          URL="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status"

          # Forgejo appends the triggering event to the context, e.g.
          # "CI / check-and-build (push)", so match by prefix rather than equality.
          for i in $(seq 1 40); do
            STATE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$URL" | jq -r '.statuses[] | select(.context | startswith("CI / check-and-build")) | .status' | head -1)

            case "$STATE" in
              success) echo "CI passed for ${{ github.sha }}"; exit 0 ;;
              failure|error) echo "::error::CI did not pass for ${{ github.sha }} (status: $STATE). Refusing to deploy."; exit 1 ;;
            esac

            echo "Waiting for CI status on ${{ github.sha }} (attempt $i/40)..."
            sleep 15
          done

          echo "::error::Timed out waiting for CI status on ${{ github.sha }}"
          exit 1

      - name: Validate required vars/secrets
        # Fail fast BEFORE any deploy work: these org-level vars/secrets must
        # be configured (Forgejo → Organization → Actions → Variables/Secrets).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          BACKEND_JWT_REFRESH_SECRET: ${{ secrets.BACKEND_JWT_REFRESH_SECRET }}
          BACKEND_POSTGRES_PASSWORD: ${{ secrets.BACKEND_POSTGRES_PASSWORD }}
          BACKEND_MINIO_SECRET_KEY: ${{ secrets.BACKEND_MINIO_SECRET_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          MINIO_API_HOSTNAME: ${{ vars.MINIO_API_HOSTNAME }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
          MINIO_MAIN_PORT_IN: ${{ vars.MINIO_MAIN_PORT_IN }}
          INTERNAL_PORT: ${{ vars.INTERNAL_PORT }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          POSTGRES_NETWORK: ${{ vars.POSTGRES_NETWORK }}
          MINIO_NETWORK: ${{ vars.MINIO_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
        run: |
          missing=0
          for var in VPS_HOST VPS_SSH_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS \
                     BACKEND_JWT_SECRET BACKEND_JWT_REFRESH_SECRET \
                     BACKEND_POSTGRES_PASSWORD BACKEND_MINIO_SECRET_KEY \
                     MINIO_ACCESS_KEY \
                     BACKEND_API_HOSTNAME DOCS_HOSTNAME LANDING_HOSTNAME \
                     WEB_HOSTNAME MINIO_API_HOSTNAME \
                     POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_DB \
                     MINIO_ENDPOINT MINIO_MAIN_PORT_IN \
                     INTERNAL_PORT TRAEFIK_NETWORK POSTGRES_NETWORK \
                     MINIO_NETWORK TRAEFIK_SERVICE BUILDX_BUILDER \
                     PACKAGE_REGISTRY_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set — configure it as a Forgejo org/repo variable or secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Aborting release: one or more required vars/secrets are missing."
            exit 1
          fi

      - name: Setup SSH
        # The VPS host key is pinned from a secret (the output of
        # `ssh-keyscan <host>` captured once from a trusted machine). A
        # per-run ssh-keyscan would trust whatever key answers on the fresh
        # runner, i.e. offer no MITM protection at all.
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build and push image to the registry
        # The image is built by the persistent `slovo-constrained` builder ON
        # the VPS (DOCKER_HOST over the SSH connection set up above — CI job
        # containers have no docker socket) and pushed to the Forgejo container
        # registry. The deploy step only pulls the published image, so no
        # source tree is shipped to the VPS any more. The builder keeps layer
        # caches between releases; --push uploads straight from the builder.
        # Pulls are anonymous (public org), only pushes need the token.
        env:
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          DEPLOY_TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          # Docker CLI + buildx are not part of the runner image: install
          # pinned static builds into the job (no daemon — the CLI talks to the
          # VPS daemon over SSH via DOCKER_HOST).
          DOCKER_CLI_VERSION=27.5.1
          BUILDX_VERSION=0.20.1
          mkdir -p "$HOME/.docker-cli"
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar xz -C "$HOME/.docker-cli" --strip-components=1 docker/docker
          curl -fsSL -o "$HOME/.docker-cli/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          chmod +x "$HOME/.docker-cli/docker-buildx"
          export PATH="$HOME/.docker-cli:$PATH"

          REGISTRY_HOST="${REPOSITORY_URL#https://}"
          # Image names must be lowercase: owner/repo come from the runner's
          # GITHUB_REPOSITORY env lowercased whole (${var,,}), so no org is
          # hardcoded and the ref always matches this repo's Packages tab
          # auto-link (Forgejo matches owner/repo case-insensitively).
          REGISTRY_IMAGE="${REPOSITORY_URL#*://}/${GITHUB_REPOSITORY,,}"
          IMAGE_REF="$REGISTRY_IMAGE"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          # Login writes only to this job's docker config; buildx forwards the
          # credentials to the remote builder for the push. Never printed.
          printf '%s' "$PACKAGE_REGISTRY_TOKEN" \
            | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin

          export DOCKER_HOST="ssh://$VPS_SSH_USER@$VPS_HOST"
          # Single-platform linux/amd64 like the former on-VPS build — the 4 GB
          # host gets no multi-arch builds.
          docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE_REF:$DEPLOY_TAG" \
            --tag "$IMAGE_REF:latest" \
            --build-arg OCI_IMAGE_SOURCE="${REPOSITORY_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Deploy to VPS
        env:
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          BACKEND_API_HOSTNAME: ${{ vars.BACKEND_API_HOSTNAME }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
          LANDING_HOSTNAME: ${{ vars.LANDING_HOSTNAME }}
          WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
          # Secrets for env file generation (NEVER passed to vps-deploy.sh as args)
          JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.BACKEND_JWT_REFRESH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.BACKEND_POSTGRES_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.BACKEND_MINIO_SECRET_KEY }}
          MINIO_API_HOSTNAME: ${{ vars.MINIO_API_HOSTNAME }}
          INTERNAL_PORT: ${{ vars.INTERNAL_PORT }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          POSTGRES_NETWORK: ${{ vars.POSTGRES_NETWORK }}
          MINIO_NETWORK: ${{ vars.MINIO_NETWORK }}
          TRAEFIK_SERVICE: ${{ vars.TRAEFIK_SERVICE }}
          BUILDX_BUILDER: ${{ vars.BUILDX_BUILDER }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
          MINIO_MAIN_PORT_IN: ${{ vars.MINIO_MAIN_PORT_IN }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          # The tag is forwarded to the remote shell below. Keep it in the
          # environment (never inline `${{ github.ref_name }}` into the command)
          # so a crafted ref name cannot inject shell syntax.
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          # Only the host key pinned from VPS_SSH_KNOWN_HOSTS is accepted; an
          # unknown or changed key aborts the deploy.
          SSH_OPTS="-o StrictHostKeyChecking=yes"
          SSH_TARGET="$VPS_SSH_USER@$VPS_HOST"

          if [ -z "${IMAGE_REF:-}" ]; then
            echo "::error::IMAGE_REF is not set — the registry build step must export it"
            exit 1
          fi

          # Step 1: Copy deploy script
          scp $SSH_OPTS scripts/vps-deploy.sh "$SSH_TARGET:/tmp/vps-deploy.sh"

          # Step 2: Generate env file ON RUNNER, pipe to VPS via SSH stdin (secrets never in process list)
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_REFRESH_SECRET=%s\n' "$JWT_REFRESH_SECRET"
            printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST"
            printf 'POSTGRES_PORT=%s\n' "$POSTGRES_PORT"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'MINIO_ENDPOINT=%s\n' "$MINIO_ENDPOINT"
            printf 'MINIO_MAIN_PORT_IN=%s\n' "$MINIO_MAIN_PORT_IN"
            printf 'MINIO_ACCESS_KEY=%s\n' "$MINIO_ACCESS_KEY"
            printf 'MINIO_SECRET_KEY=%s\n' "$MINIO_SECRET_KEY"
            printf 'MINIO_PUBLIC_URI=%s\n' "https://$MINIO_API_HOSTNAME"
            printf 'DOCS_ENABLED=%s\n' "false"
            printf 'DOCS_HOSTNAME=%s\n' "$DOCS_HOSTNAME"
            printf 'DOCS_UI_ORIGIN=%s\n' "https://$DOCS_HOSTNAME"
            printf 'LANDING_HOSTNAME=%s\n' "$LANDING_HOSTNAME"
            printf 'WEB_HOSTNAME=%s\n' "$WEB_HOSTNAME"
            printf 'NODE_OPTIONS=%s\n' "--max-old-space-size=256"
          } | ssh $SSH_OPTS "$SSH_TARGET" \
            "mkdir -p /slovo/backend && cat > /slovo/backend/env && chmod 0640 /slovo/backend/env && chown slovo:slovo /slovo/backend/env"

          # Step 3: Run deploy script (NO secrets passed — env file already written).
          # Shared infra (Traefik, Docker, slovo user, buildx) is owned by the
          # slovo-propovedi playbook; the script only verifies it. The image was
          # built and pushed in the previous step; this one just pulls it.
          # Every value is shell-quoted for the remote shell (single literal value).
          DEPLOY_TAG_REMOTE=$(printf '%q' "$DEPLOY_TAG")
          IMAGE_REF_REMOTE=$(printf '%q' "$IMAGE_REF")
          ssh $SSH_OPTS "$SSH_TARGET" \
            "DEPLOY_TAG=$DEPLOY_TAG_REMOTE \
             IMAGE_REF=$IMAGE_REF_REMOTE \
             BACKEND_API_HOSTNAME='$BACKEND_API_HOSTNAME' \
             INTERNAL_PORT='$INTERNAL_PORT' \
             TRAEFIK_NETWORK='$TRAEFIK_NETWORK' \
             POSTGRES_NETWORK='$POSTGRES_NETWORK' \
             MINIO_NETWORK='$MINIO_NETWORK' \
             TRAEFIK_SERVICE='$TRAEFIK_SERVICE' \
             BUILDX_BUILDER='$BUILDX_BUILDER' \
             bash /tmp/vps-deploy.sh"

      - name: Smoke test — GET /health
        # After the image is built and the service restarted on the VPS, confirm
        # the running container serves GET /health. Retries cover a cold start and
        # Traefik certificate warm-up.
        env:
          HEALTH_URL: https://${{ vars.BACKEND_API_HOSTNAME }}/health
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Smoke OK: $HEALTH_URL -> 200"
              exit 0
            fi
            echo "attempt $i/30: HTTP $CODE"
            sleep 5
          done
          echo "::error::Smoke test failed: $HEALTH_URL did not return 200"
          exit 1

      - name: Extract changelog section
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          awk -v ver="$TAG_VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[" ver "\\]") }
            in_section { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "::error::No changelog section found for version $TAG_VERSION"
            exit 1
          fi

      - name: Create Forgejo Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(cat release-body.md)
          PAYLOAD=$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg name "Release $TAG_VERSION" \
            --arg body "$BODY" \
            '{tag_name: $tag, name: $name, body: $body}')

          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Failed to create release (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Release created successfully!"

      - name: Cleanup
        if: always()
        run: |
          rm -f release-body.md
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
